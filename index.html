    body {

      min-height: 100vh;
      color: #40101A;
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: -15%;
      pointer-events: none;
      z-index: 0;

    function EditableText({
      textKey,
      fallback,
      overrides,
      editMode,
      onChangeText,
      className = "",
      as = "span",
      title = "Κλικ για επεξεργασία κειμένου"
    }) {
      const [editing, setEditing] = useState(false);
      const currentVal =
        overrides && Object.prototype.hasOwnProperty.call(overrides, textKey)
          ? overrides[textKey]
          : fallback;
      const [draft, setDraft] = useState(currentVal);

      useEffect(() => {
        setDraft(currentVal);
      }, [currentVal]);

      const commit = () => {
        setEditing(false);
        const cleaned = draft.trim();
        onChangeText(textKey, cleaned === "" ? fallback : draft);
      };

      if (editMode && editing) {
        return (
          <input
            type="text"
            value={draft}
            onChange={(e) => setDraft(e.target.value)}
            onBlur={commit}
            onKeyDown={(e) => {
              if (e.key === "Enter") {
                e.preventDefault();
                commit();
              }
              if (e.key === "Escape") {
                setDraft(currentVal);
                setEditing(false);
              }
            }}
            onClick={(e) => e.stopPropagation()}
            className="px-1.5 py-0.5 text-inherit font-inherit bg-white text-[#40101A] border border-[#6E1927] rounded shadow-xs focus:outline-none min-w-[70px]"
            autoFocus
          />
        );
      }

      const Tag = as;
      return (
        <Tag
          onClick={(e) => {
            if (!editMode) return;
            e.preventDefault();
            e.stopPropagation();
            setDraft(currentVal);
            setEditing(true);
          }}
          title={editMode ? title : undefined}
          className={`${className} ${editMode ? "nvr-editable-active" : ""}`}
        >
          {currentVal}
        </Tag>
      );
    }

    const formatDateShort = (isoDate) => {
      if (!isoDate) return "—";
      if (isoDate.includes("/")) return isoDate;
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0].slice(-2)}`;
    };

    const formatDateGR = (isoDate) => {
      if (!isoDate) return "—";
      if (isoDate.includes("/")) return isoDate;
      const parts = isoDate.split("-");
      if (parts.length !== 3) return isoDate;
      return `${parts[2]}/${parts[1]}/${parts[0]}`;
    };

    const toISODate = (dateStr) => {
      if (!dateStr) return new Date().toISOString().slice(0, 10);
      if (dateStr.includes("/")) {
        const [d, m, y] = dateStr.split("/");
        if (d && m && y) {
          const fullY = y.length === 2 ? `20${y}` : y;
          return `${fullY}-${m.padStart(2, "0")}-${d.padStart(2, "0")}`;
        }
      }
      return dateStr;
    };

    function OptionSelect({
      value,
      options,
      onChange,
      onQuickAdd,
      allowQuickAdd = true,
      categoryLabel = "επιλογής",
      placeholder = "Νέα επιλογή...",
      defaultColor = "crimsonVinyl",

      const [open, setOpen] = useState(false);
      const [adding, setAdding] = useState(false);
      const [newName, setNewName] = useState("");
      const [newColor, setNewColor] = useState(defaultColor);
      const [menuStyle, setMenuStyle] = useState(null);
      const ref = useRef(null);
      const menuRef = useRef(null);

      const updateMenuPosition = () => {
        if (!ref.current) return;
        const rect = ref.current.getBoundingClientRect();
        const menuWidth = Math.max(240, rect.width);
        const spaceBelow = window.innerHeight - rect.bottom - 12;
        const spaceAbove = rect.top - 12;
        const openUpward = spaceBelow < 260 && spaceAbove > spaceBelow;

        let left = rect.left;
        if (left + menuWidth > window.innerWidth - 12) {
          left = Math.max(12, window.innerWidth - menuWidth - 12);
        }

        if (openUpward) {
          setMenuStyle({
            position: "fixed",
            left: `${left}px`,
            bottom: `${window.innerHeight - rect.top + 4}px`,
            width: `${menuWidth}px`,
            maxHeight: `${Math.max(220, spaceAbove)}px`,
            zIndex: 9999
          });
        } else {
          setMenuStyle({
            position: "fixed",
            left: `${left}px`,
            top: `${rect.bottom + 4}px`,
            width: `${menuWidth}px`,
            maxHeight: `${Math.max(220, spaceBelow)}px`,
            zIndex: 9999
          });
        }
      };

      useEffect(() => {
        if (!open) return;
        updateMenuPosition();

        const onDocClick = (e) => {
          const inTrigger = ref.current && ref.current.contains(e.target);
          const inMenu = menuRef.current && menuRef.current.contains(e.target);
          if (!inTrigger && !inMenu) {
            setOpen(false);
            setAdding(false);
          }
        };
        const onWindowChange = () => updateMenuPosition();

        document.addEventListener("mousedown", onDocClick);
        window.addEventListener("resize", onWindowChange);
        window.addEventListener("scroll", onWindowChange, true);
        return () => {
          document.removeEventListener("mousedown", onDocClick);
          window.removeEventListener("resize", onWindowChange);
          window.removeEventListener("scroll", onWindowChange, true);
        };
      }, [open, adding, options.length]);

      const current = options.find((o) => o.name === value);
      const tokens = getColorTokens(current?.color, defaultColor);

      const submitNew = (e) => {
        if (e) e.preventDefault();
        const trimmed = newName.trim();
        if (!trimmed) return;
        if (onQuickAdd) onQuickAdd(trimmed, newColor);
        onChange(trimmed);
        setNewName("");
        setAdding(false);
        setOpen(false);
      };

      const dropdownMenu =
        open && menuStyle
          ? window.ReactDOM.createPortal(
              <div
                ref={menuRef}
                style={menuStyle}
                className="nvr-glass-dropdown rounded-xl flex flex-col overflow-hidden text-left"
              >
                <div className="overflow-y-auto p-1.5 space-y-0.5 flex-1">
                  {options.map((opt) => {
                    const optTokens = getColorTokens(opt.color, defaultColor);
                    const active = opt.name === value;
                    return (
                      <button
                        key={opt.name}
                        type="button"
                        onClick={() => {
                          onChange(opt.name);
                          setOpen(false);
                        }}
                        className={`w-full flex items-center justify-between px-2 py-1.5 rounded-lg text-xs transition-colors cursor-pointer ${
                          active ? "bg-[#E6DFE4] font-bold text-[#40101A]" : "hover:bg-[#EDE8EC] text-[#40101A]"
                        }`}
                      >
                        <span className={`inline-flex items-center gap-1.5 px-2 py-0.5 rounded-full text-[11px] font-medium border ${optTokens.pill}`}>
                          <span className={`w-1.5 h-1.5 rounded-full ${optTokens.dot}`} />
                          {opt.name}
                        </span>
                        {active && <span className="text-[#6E1927] font-bold">✓</span>}
                      </button>
                    );
                  })}
                </div>

                {allowQuickAdd && (
                  <div className="border-t border-[#D6CED5] bg-[#EFECEF] p-2 shrink-0">
                    {!adding ? (
                      <button
                        type="button"
                        onClick={() => setAdding(true)}
                        className="w-full flex items-center gap-1.5 px-2 py-1.5 rounded-lg text-xs font-semibold text-[#6E1927] hover:bg-[#E4DCE1] transition-colors cursor-pointer"
                      >
                        <span>+ Προσθήκη νέας {categoryLabel}...</span>
                      </button>
                    ) : (
                      <div className="space-y-2">
                        <input
                          type="text"
                          value={newName}
                          onChange={(e) => setNewName(e.target.value)}
                          onKeyDown={(e) => {
                            if (e.key === "Enter") {
                              e.preventDefault();
                              submitNew();
                            }
                            if (e.key === "Escape") setAdding(false);
                          }}
                          placeholder={placeholder}
                          className="w-full px-2.5 py-1.5 text-xs bg-white text-[#40101A] border border-[#C7BEC6] rounded-lg focus:outline-none focus:border-[#6E1927]"
                          autoFocus
                        />
                        <div className="flex items-center justify-between gap-1">
                          <div className="flex flex-wrap gap-1">
                            {COLOR_KEYS.slice(0, 7).map((cKey) => (
                              <button
                                key={cKey}
                                type="button"
                                onClick={() => setNewColor(cKey)}
                                title={BADGE_COLORS[cKey].label}
                                className={`w-4 h-4 rounded-full ${BADGE_COLORS[cKey].dot} ${
                                  newColor === cKey ? "ring-2 ring-offset-1 ring-[#40101A] scale-110" : "opacity-75"
                                }`}
                              />
                            ))}
                          </div>
                          <button
                            type="button"
                            onClick={submitNew}
                            disabled={!newName.trim()}
                            className="px-2.5 py-1 text-[11px] font-semibold bg-[#6E1927] text-white rounded-md hover:bg-[#8A2233] disabled:opacity-40 cursor-pointer"
                          >
                            Προσθήκη
                          </button>
                        </div>
                      </div>
                    )}
                  </div>
                )}
              </div>,
              document.body
            )
          : null;

      return (
        <div ref={ref} className={`relative ${compact ? "inline-block max-w-full" : "block w-full"}`}>
          <button
            type="button"
            onClick={() => {
              setOpen((prev) => !prev);
              setAdding(false);
            }}
            className={`nvr-btn-press inline-flex items-center justify-between gap-1 font-semibold border shadow-2xs hover:shadow-xs cursor-pointer focus:outline-none max-w-full ${
              compact
                ? "px-2 py-0.5 rounded-full text-[10.5px] leading-tight"
                : "w-full px-3 py-2 rounded-lg text-xs"
            } ${tokens.pill}`}
          >
            <span className="truncate">{value || placeholderLabel}</span>
            <span className="text-[8px] opacity-75 shrink-0">▼</span>
          </button>
          {dropdownMenu}
        </div>
      );
    }

        const serialized = JSON.stringify(value);
        try {
          window.localStorage.setItem(key, serialized);

        try {
          const wn = window.name ? JSON.parse(window.name) : {};

        const startWidth = cellSizes.colWidths[colKey] || DEFAULT_CELL_SIZES.colWidths[colKey] || 80;

        const applyDelta = (clientX) => {
          const delta = clientX - startX;
          const nextWidth = Math.max(34, Math.min(420, Math.round(startWidth + delta)));
          setCellSizes((prev) => ({
            ...prev,
            colWidths: { ...prev.colWidths, [colKey]: nextWidth }
          }));
        };

        const onMouseMove = (moveEvent) => applyDelta(moveEvent.clientX);
        const onTouchMove = (touchEvent) => {
          if (touchEvent.touches && touchEvent.touches.length > 0) {
            touchEvent.preventDefault();
            applyDelta(touchEvent.touches[0].clientX);
          }
        };

        const cleanup = () => {
          window.removeEventListener("mousemove", onMouseMove);
          window.removeEventListener("mouseup", cleanup);
          window.removeEventListener("touchmove", onTouchMove);
          window.removeEventListener("touchend", cleanup);
          window.removeEventListener("touchcancel", cleanup);
        };

        window.addEventListener("mousemove", onMouseMove);
        window.addEventListener("mouseup", cleanup);
        window.addEventListener("touchmove", onTouchMove, { passive: false });
        window.addEventListener("touchend", cleanup);
        window.addEventListener("touchcancel", cleanup);
      };

      const handleRowHeightChange = (delta) => {
        setCellSizes((prev) => ({
          ...prev,
          rowMinHeight: Math.max(32, Math.min(140, (Number(prev.rowMinHeight) || 40) + delta))
        }));
      };

      const handleResetCellSizes = () => {
        setCellSizes(DEFAULT_CELL_SIZES);
        showToast("Επανήλθαν τα αρχικά μεγέθη κελιών.");
      };

      // =======================================================================
      // SUPABASE SYNC ENGINE (orders & app_config tables)
      // =======================================================================
      const saveConfigToSupabase = async (nextConfig) => {
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));
        const basePayload = {
          products: nextConfig.products,
          couriers: nextConfig.couriers,
          channels: nextConfig.channels,
          statuses: nextConfig.statuses,
          updated_at: new Date().toISOString()
        };
        try {
          await sbFetch("app_config?id=eq.1", {
            method: "PATCH",
            body: JSON.stringify({
              ...basePayload,
              payment_methods: nextConfig.paymentMethods
            })
          });
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
        } catch (err) {
          if (String(err.message).includes("payment_methods")) {
            try {
              await sbFetch("app_config?id=eq.1", {
                method: "PATCH",
                body: JSON.stringify(basePayload)
              });
              setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
              return;
            } catch (e2) {
              setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: e2.message });
              showToast(`Σφάλμα Supabase: ${e2.message}`, "error");
              return;
            }
          }
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
          showToast(`Σφάλμα Supabase: ${err.message}`, "error");
        }
      };

      const pullFromSupabase = async (seedIfEmpty = false) => {
        if (inlineEditRef.current || isSavingInlineRef.current || isOrderModalOpen || customerModalOrder) return;
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));
        try {
          const [dbOrders, dbConfig] = await Promise.all([
            sbFetch("orders?select=*&order=id.asc"),
            sbFetch("app_config?id=eq.1&select=*")
          ]);

          if (inlineEditRef.current || isSavingInlineRef.current) return;

          if (Array.isArray(dbOrders) && dbOrders.length > 0) {
            const normalized = dbOrders.map(normalizeOrderFromDb);
            setOrders(normalized);
          } else if (seedIfEmpty && ordersRef.current.length > 0) {
            await sbFetch("orders", {
              method: "POST",
              body: JSON.stringify(ordersRef.current.map((o) => serializeOrderForDb(o, true)))
            });
          } else if (Array.isArray(dbOrders)) {
            setOrders([]);
          }

          if (Array.isArray(dbConfig) && dbConfig.length > 0) {
            const row = dbConfig[0];
            setConfig({
              statuses: row.statuses?.length ? row.statuses : DEFAULT_CONFIG.statuses,
              channels: row.channels?.length ? row.channels : DEFAULT_CONFIG.channels,
              couriers: row.couriers?.length ? row.couriers : DEFAULT_CONFIG.couriers,
              paymentMethods: row.payment_methods?.length ? row.payment_methods : DEFAULT_CONFIG.paymentMethods,
              products: row.products?.length ? row.products : DEFAULT_CONFIG.products
            });
          }

          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
        } catch (err) {
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
        }
      };

      useEffect(() => {
        pullFromSupabase(true);
        const interval = setInterval(() => pullFromSupabase(false), 15000);
        const onFocus = () => pullFromSupabase(false);
        window.addEventListener("focus", onFocus);
        return () => {
          clearInterval(interval);
          window.removeEventListener("focus", onFocus);
        };
      }, [isOrderModalOpen, customerModalOrder]);

      const updateConfigState = (updater) => {
        setConfig((prev) => {
          const next = typeof updater === "function" ? updater(prev) : updater;
          saveConfigToSupabase(next);
          return next;
        });
      };

      const handleEditTextOverride = (key, value) => {
        setTextOverrides((prev) => {
          const next = { ...prev };
          if (value === DEFAULT_UI_TEXT[key]) delete next[key];
          else next[key] = value;
          return next;
        });
      };

      const handleResetAllTextOverrides = () => {
        setTextOverrides({});
        showToast("Επανήλθαν τα προεπιλεγμένα κείμενα UI.");
      };

      // =======================================================================
      // OPTIONS & PRODUCTS HANDLERS
      // =======================================================================
      const handleAddOption = (category, name, color = "crimsonVinyl", extra = {}) => {
        const trimmed = name.trim();
        if (!trimmed) return false;
        const list = config[category] || [];
        if (list.some((item) => item.name.toLowerCase() === trimmed.toLowerCase())) {
          showToast(`Η επιλογή "${trimmed}" υπάρχει ήδη.`, "info");
          return false;
        }

        const newItem =
          category === "products"
            ? {
                name: trimmed,
                shortName: extra.shortName?.trim() || trimmed,
                subtitle: extra.subtitle?.trim() || `Νέα Έκδοση • Αρχικό ${Math.max(0, parseInt(extra.initialStock, 10) || 0)}`,
                initialStock: Math.max(0, parseInt(extra.initialStock, 10) || 0),
                color
              }
            : { name: trimmed, color };

        updateConfigState((prev) => ({
          ...prev,
          [category]: [...prev[category], newItem]
        }));
        showToast(`Προστέθηκε: "${trimmed}"`);
        return true;
      };

      const handleUpdateOption = (category, oldName, updates) => {
        const newName = updates.name !== undefined ? updates.name.trim() : oldName;
        if (!newName) return;
        if (
          newName.toLowerCase() !== oldName.toLowerCase() &&
          config[category].some((i) => i.name.toLowerCase() === newName.toLowerCase())
        ) {
          showToast(`Υπάρχει ήδη επιλογή "${newName}".`, "error");
          return;
        }

        updateConfigState((prev) => ({
          ...prev,
          [category]: prev[category].map((item) =>
            item.name === oldName ? { ...item, ...updates, name: newName } : item
          )
        }));

        if (newName !== oldName) {
          setOrders((prevOrders) =>
            prevOrders.map((order) => {
              let updated = order;
              if (category === "couriers" && order.courierName === oldName) updated = { ...order, courierName: newName };
              if (category === "paymentMethods" && order.paymentMethod === oldName) updated = { ...order, paymentMethod: newName };
              if (category === "channels" && order.salesChannel === oldName) updated = { ...order, salesChannel: newName };
              if (category === "statuses" && order.status === oldName) updated = { ...order, status: newName };
              if (category === "products") {
                updated = {
                  ...order,
                  items: order.items.map((it) => (it.product === oldName ? { ...it, product: newName } : it))
                };
              }
              if (updated !== order) {
                sbFetch(`orders?id=eq.${order.id}`, {
                  method: "PATCH",
                  body: JSON.stringify(serializeOrderForDb(updated))
                }).catch(() => {});
              }
              return updated;
            })
          );
          if (category === "couriers" && courierFilter === oldName) setCourierFilter(newName);
          if (category === "paymentMethods" && paymentMethodFilter === oldName) setPaymentMethodFilter(newName);
          if (category === "channels" && channelFilter === oldName) setChannelFilter(newName);
          if (category === "statuses" && statusFilter === oldName) setStatusFilter(newName);
          if (category === "products" && productFilter === oldName) setProductFilter(newName);
        }
        showToast("Ενημερώθηκε επιτυχώς.");
      };

      const handleDeleteOption = (category, optionName) => {
        if (config[category].length <= 1) {
          showToast("Πρέπει να υπάρχει τουλάχιστον 1 επιλογή.", "error");
          return;
        }
        const inUse = orders.filter((o) => {
          if (category === "couriers") return o.courierName === optionName;
          if (category === "paymentMethods") return o.paymentMethod === optionName;
          if (category === "channels") return o.salesChannel === optionName;
          if (category === "statuses") return o.status === optionName;
          if (category === "products") return o.items.some((i) => i.product === optionName && i.qty > 0);
          return false;
        }).length;

        if (inUse > 0) {
          showToast(`Δεν διαγράφεται: χρησιμοποιείται σε ${inUse} παραγγελίες.`, "error");
          return;
        }

        updateConfigState((prev) => ({
          ...prev,
          [category]: prev[category].filter((i) => i.name !== optionName)
        }));
        if (category === "couriers" && courierFilter === optionName) setCourierFilter("ALL");
        if (category === "paymentMethods" && paymentMethodFilter === optionName) setPaymentMethodFilter("ALL");
        if (category === "channels" && channelFilter === optionName) setChannelFilter("ALL");
        if (category === "statuses" && statusFilter === optionName) setStatusFilter("ALL");
        if (category === "products" && productFilter === optionName) setProductFilter("ALL");
        showToast(`Διαγράφηκε το "${optionName}".`, "info");
      };

      const handleMoveOption = (category, index, dir) => {
        const nextIdx = index + dir;
        if (nextIdx < 0 || nextIdx >= config[category].length) return;
        updateConfigState((prev) => {
          const copy = [...prev[category]];
          const [moved] = copy.splice(index, 1);
          copy.splice(nextIdx, 0, moved);
          return { ...prev, [category]: copy };
        });
      };

      // =======================================================================
      // INVENTORY & KPI CALCULATIONS
      // =======================================================================
      const inventoryStats = useMemo(() => {
        const stats = {};
        config.products.forEach((prod) => {
          stats[prod.name] = {
            ...prod,
            initial: Number(prod.initialStock) || 0,
            allocated: 0,
            pending: 0,
            shippedOrDelivered: 0
          };
        });

        orders.forEach((order) => {
          order.items.forEach((item) => {
            if (stats[item.product]) {
              const qty = Number(item.qty) || 0;
              stats[item.product].allocated += qty;
              if (order.status === "Pending") {
                stats[item.product].pending += qty;
              } else {
                stats[item.product].shippedOrDelivered += qty;
              }
            }
          });
        });

        Object.keys(stats).forEach((k) => {
          stats[k].availableAfterAllocated = stats[k].initial - stats[k].allocated;
          stats[k].physicalOnShelf = stats[k].initial - stats[k].shippedOrDelivered;
        });

        return stats;
      }, [orders, config.products]);

      const summaryStats = useMemo(() => {
        let paidRevenue = 0;
        let unpaidAmount = 0;
        let unpaidCount = 0;
        let pendingCount = 0;
        let totalUnits = 0;
        const channelBreakdown = {};

        config.channels.forEach((ch) => {
          channelBreakdown[ch.name] = { count: 0, units: 0, revenue: 0, color: ch.color };
        });

        orders.forEach((o) => {
          const amt = Number(o.totalAmount) || 0;
          const gift = isOrderGift(o);

          if (o.isPaid) {
            paidRevenue += amt;
          } else if (!gift) {
            unpaidCount += 1;
            unpaidAmount += amt;
          }

          if (o.status === "Pending") pendingCount += 1;
          const units = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          totalUnits += units;

          if (!channelBreakdown[o.salesChannel]) {
            channelBreakdown[o.salesChannel] = { count: 0, units: 0, revenue: 0, color: "stone" };
          }
          channelBreakdown[o.salesChannel].count += 1;
          channelBreakdown[o.salesChannel].units += units;
          channelBreakdown[o.salesChannel].revenue += amt;
        });

        return {
          paidRevenue,
          unpaidAmount,
          unpaidCount,
          totalOrders: orders.length,
          totalUnits,
          pendingCount,
          channelBreakdown
        };
      }, [orders, config.channels]);

      // =======================================================================
      // FILTERED & GROUPED ORDERS
      // =======================================================================
      const filteredOrders = useMemo(() => {
        return orders.filter((order) => {
          if (searchQuery.trim() !== "") {
            const q = searchQuery.toLowerCase().trim();
            const matchCustomer = (order.customer || "").toLowerCase().includes(q);
            const matchPhone = (order.customerPhone || "").toLowerCase().includes(q);
            const matchEmail = (order.customerEmail || "").toLowerCase().includes(q);
            const matchAddress = (order.customerAddress || "").toLowerCase().includes(q);
            const matchTracking = (order.trackingNumber || "").toLowerCase().includes(q);
            const matchId = String(order.id) === q || `#${order.id}` === q;
            const matchInvoice = (order.invoiceNumber || "").toLowerCase().includes(q);
            const matchCourier = (order.courierName || "").toLowerCase().includes(q);
            const matchChannel = (order.salesChannel || "").toLowerCase().includes(q);
            const matchPaymentMethod = (order.paymentMethod || "").toLowerCase().includes(q);
            if (
              !matchCustomer &&
              !matchPhone &&
              !matchEmail &&
              !matchAddress &&
              !matchTracking &&
              !matchId &&
              !matchInvoice &&
              !matchCourier &&
              !matchChannel &&
              !matchPaymentMethod
            ) {
              return false;
            }
          }
          if (statusFilter !== "ALL" && order.status !== statusFilter) return false;
          if (paymentFilter === "PAID" && !order.isPaid) return false;
          if (paymentFilter === "UNPAID" && (order.isPaid || isOrderGift(order))) return false;
          if (paymentMethodFilter !== "ALL" && (order.paymentMethod || "") !== paymentMethodFilter) return false;
          if (channelFilter !== "ALL" && order.salesChannel !== channelFilter) return false;
          if (courierFilter !== "ALL" && order.courierName !== courierFilter) return false;
          if (productFilter !== "ALL") {
            if (!order.items.some((i) => i.product === productFilter && i.qty > 0)) return false;
          }
          return true;
        });
      }, [orders, searchQuery, statusFilter, paymentFilter, paymentMethodFilter, channelFilter, productFilter, courierFilter]);

      const groupedSections = useMemo(() => {
        const known = new Set(config.statuses.map((s) => s.name));
        const sections = config.statuses.map((st) => {
          const groupOrders = filteredOrders.filter((o) => o.status === st.name);
          const totalUnits = groupOrders.reduce(
            (sum, o) => sum + o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0),
            0
          );
          const totalRevenue = groupOrders.reduce((sum, o) => sum + (Number(o.totalAmount) || 0), 0);
          return { statusName: st.name, color: st.color, orders: groupOrders, totalUnits, totalRevenue };
        });

        const extras = filteredOrders.filter((o) => !known.has(o.status));
        if (extras.length > 0) {
          const mapExtras = {};
          extras.forEach((o) => {
            if (!mapExtras[o.status]) mapExtras[o.status] = [];
            mapExtras[o.status].push(o);
          });
          Object.entries(mapExtras).forEach(([statusName, groupOrders]) => {
            const totalUnits = groupOrders.reduce(
              (sum, o) => sum + o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0),
              0
            );
            const totalRevenue = groupOrders.reduce((sum, o) => sum + (Number(o.totalAmount) || 0), 0);
            sections.push({ statusName, color: "stone", orders: groupOrders, totalUnits, totalRevenue });
          });
        }
        return sections;
      }, [filteredOrders, config.statuses]);

      const activeFiltersCount = [
        statusFilter !== "ALL",
        paymentFilter !== "ALL",
        paymentMethodFilter !== "ALL",
        channelFilter !== "ALL",
        productFilter !== "ALL",
        courierFilter !== "ALL",
        searchQuery.trim() !== ""
      ].filter(Boolean).length;

      const clearAllFilters = () => {
        setSearchQuery("");
        setStatusFilter("ALL");
        setPaymentFilter("ALL");
        setPaymentMethodFilter("ALL");
        setChannelFilter("ALL");
        setProductFilter("ALL");
        setCourierFilter("ALL");
      };

      // =======================================================================
      // ORDER CRUD & INLINE EDITS (PERSISTED TO SUPABASE & LOCALSTORAGE)
      // =======================================================================
      const nextOrderId = useMemo(() => {
        if (!orders.length) return 1;
        return Math.max(...orders.map((o) => Number(o.id) || 0)) + 1;
      }, [orders]);

      const handleSaveOrder = async (data) => {
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));
        try {
          if (editingOrder) {
            const updatedObj = { ...data, id: editingOrder.id };
            await sbFetch(`orders?id=eq.${editingOrder.id}`, {
              method: "PATCH",
              body: JSON.stringify(serializeOrderForDb(updatedObj))
            });
            setOrders((prev) => prev.map((o) => (o.id === editingOrder.id ? updatedObj : o)));
            showToast(`Η παραγγελία #${editingOrder.id} ενημερώθηκε στο Supabase.`);
          } else {
            const createdRows = await sbFetch("orders", {
              method: "POST",
              body: JSON.stringify(serializeOrderForDb(data, false))
            });
            const createdObj = createdRows?.[0]
              ? normalizeOrderFromDb(createdRows[0])
              : { ...data, id: nextOrderId };
            setOrders((prev) => [...prev, createdObj]);
            showToast(`Προστέθηκε η παραγγελία #${createdObj.id} στο Supabase.`);
          }
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
          setIsOrderModalOpen(false);
          setEditingOrder(null);
          setDefaultModalStatus(null);
        } catch (err) {
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
          showToast(`Σφάλμα αποθήκευσης: ${err.message}`, "error");
        }
      };

      const handleSaveCustomerDetails = async (orderId, contactUpdates) => {
        const cleanUpdates = {
          customer: contactUpdates.customer.trim(),
          customerPhone: contactUpdates.customerPhone.trim(),
          customerEmail: contactUpdates.customerEmail.trim(),
          customerAddress: contactUpdates.customerAddress.trim()
        };

        setOrders((prev) =>
          prev.map((o) => (o.id === orderId ? { ...o, ...cleanUpdates } : o))
        );
        setCustomerModalOrder(null);
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));

        try {
          await sbFetch(`orders?id=eq.${orderId}`, {
            method: "PATCH",
            body: JSON.stringify({
              customer: cleanUpdates.customer,
              customer_phone: cleanUpdates.customerPhone,
              customer_email: cleanUpdates.customerEmail,
              customer_address: cleanUpdates.customerAddress,
              updated_at: new Date().toISOString()
            })
          });
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
          showToast(`Αποθηκεύτηκαν τα στοιχεία του πελάτη (${cleanUpdates.customer}).`);
        } catch (err) {
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
          showToast(`Σφάλμα αποθήκευσης στοιχείων πελάτη: ${err.message}`, "error");
        }
      };

      const handleDeleteOrder = async (id) => {
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));
        try {
          await sbFetch(`orders?id=eq.${id}`, { method: "DELETE" });
          setOrders((prev) => prev.filter((o) => o.id !== id));
          setOrderToDelete(null);
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
          showToast(`Η παραγγελία #${id} διαγράφηκε.`, "info");
        } catch (err) {
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
          showToast(`Σφάλμα διαγραφής: ${err.message}`, "error");
        }
      };

      const handleStatusChange = async (orderId, newStatus) => {
        setOrders((prev) => prev.map((o) => (o.id === orderId ? { ...o, status: newStatus } : o)));
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));
        try {
          await sbFetch(`orders?id=eq.${orderId}`, {
            method: "PATCH",
            body: JSON.stringify({ status: newStatus, updated_at: new Date().toISOString() })
          });
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
          showToast(`#${orderId} → ${newStatus}`);
        } catch (err) {
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
          showToast(`Σφάλμα ενημέρωσης: ${err.message}`, "error");
        }
      };

      const handleTogglePaid = async (orderId, nextPaid) => {
        setOrders((prev) => prev.map((o) => (o.id === orderId ? { ...o, isPaid: nextPaid } : o)));
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));
        try {
          await sbFetch(`orders?id=eq.${orderId}`, {
            method: "PATCH",
            body: JSON.stringify({ is_paid: nextPaid, updated_at: new Date().toISOString() })
          });
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
          showToast(nextPaid ? `#${orderId} σημειώθηκε ως Πληρωμένο` : `#${orderId} σημειώθηκε ως Απλήρωτο`);
        } catch (err) {
          setSyncState({ status: "offline", lastSync: syncState.lastSync, errorMsg: err.message });
          showToast(`Σφάλμα ενημέρωσης πληρωμής: ${err.message}`, "error");
        }
      };

      const handleInlineSave = async (orderId, field, rawVal) => {
        if (isSavingInlineRef.current) return;
        inlineEditRef.current = null;
        setInlineEdit(null);
        isSavingInlineRef.current = true;

        const targetOrder = ordersRef.current.find((o) => Number(o.id) === Number(orderId));
        if (!targetOrder) {
          isSavingInlineRef.current = false;
          return;
        }

        let nextOrder = null;
        let dbPatch = null;
        let labelText = "";

        if (field === "totalAmount") {
          const trimmed = String(rawVal ?? "").trim().replace(",", ".");
          const num = trimmed === "" ? null : parseFloat(trimmed);
          const cleanVal = num === null || isNaN(num) ? null : num;
          nextOrder = { ...targetOrder, totalAmount: cleanVal };
          dbPatch = { total_amount: cleanVal, updated_at: new Date().toISOString() };
          labelText = `Ποσό (${formatCurrency(cleanVal)})`;
        } else {
          const cleanStr = String(rawVal ?? "").trim();
          const fieldMap = {
            paymentMethod: "payment_method",
            salesChannel: "sales_channel",
            courierName: "courier_name",
            trackingNumber: "tracking_number",
            invoiceNumber: "invoice_number"
          };
          const dbCol = fieldMap[field] || field;
          nextOrder = { ...targetOrder, [field]: cleanStr };
          dbPatch = { [dbCol]: cleanStr, updated_at: new Date().toISOString() };
          labelText =
            field === "trackingNumber"
              ? `Tracking (${cleanStr || "—"})`
              : field === "invoiceNumber"
              ? `ΑΠΥ/ΤΔΑ (${cleanStr || "—"})`
              : field === "paymentMethod"
              ? `Τρόπος πληρωμής (${cleanStr || "—"})`
              : cleanStr || "—";
        }

        setOrders((prev) =>
          prev.map((o) => (Number(o.id) === Number(orderId) ? nextOrder : o))
        );
        setSyncState((s) => ({ ...s, status: "syncing", errorMsg: "" }));

        try {
          await sbFetch(`orders?id=eq.${Number(orderId)}`, {
            method: "PATCH",
            body: JSON.stringify(dbPatch)
          });
          setSyncState({ status: "synced", lastSync: new Date(), errorMsg: "" });
          showToast(`#${orderId}: αποθηκεύτηκε ${labelText}`);

      // =======================================================================
      // CSV EXPORT & IMPORT
      // =======================================================================
      const handleExportCSV = () => {
        const prodCols = config.products.map((p) => `${p.shortName || p.name} Qty`);
        const headers = [
          "Order ID",
          "Customer",
          "Phone",
          "Email",
          "Address",
          "Product",
          "Quantity",
          ...prodCols,
          "Total Amount",
          "Paid",
          "Payment Method",
          "Order Date",
          "Sales Channel",
          "Status",
          "Courier Name",
          "Tracking Number",
          "Invoice/Receipt Number"
        ];

        const rows = orders.map((o) => {
          const perProd = config.products.map((p) => {
            const found = o.items.find((i) => i.product === p.name);
            return found ? found.qty : 0;
          });
          const totalQty = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          const prodSummary = o.items.map((i) => `${i.product} (x${i.qty})`).join(", ");

          return [
            o.id,
            `"${(o.customer || "").replace(/"/g, '""')}"`,
            `"${(o.customerPhone || "").replace(/"/g, '""')}"`,
            `"${(o.customerEmail || "").replace(/"/g, '""')}"`,
            `"${(o.customerAddress || "").replace(/"/g, '""')}"`,
            `"${prodSummary}"`,
            totalQty,
            ...perProd,
            o.totalAmount !== null && o.totalAmount !== undefined ? o.totalAmount : "",
            isOrderGift(o) ? "Gift" : o.isPaid ? "Yes" : "No",
            `"${o.paymentMethod || ""}"`,
            formatDateGR(o.orderDate),
            `"${o.salesChannel}"`,
            `"${o.status}"`,
            `"${o.courierName}"`,
            `"${o.trackingNumber || ""}"`,
            `"${o.invoiceNumber || ""}"`
          ].join(",");
        });

        const csv = "\uFEFF" + [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = `Nouvelle_Ville_314LP_${new Date().toISOString().slice(0, 10)}.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast("Εξήχθη το αρχείο CSV.");
      };

      const handleImportCSV = (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          try {
            const text = ev.target?.result;
            if (typeof text !== "string") return;
            const lines = text.split(/\r?\n/).filter((l) => l.trim().length > 0);
            if (lines.length < 2) {
              showToast("Το CSV δεν περιέχει εγγραφές.", "error");
              return;
            }

            const parseLine = (line) => {
              const out = [];
              let cur = "";
              let q = false;
              for (let i = 0; i < line.length; i++) {
                const ch = line[i];
                if (ch === '"') {
                  if (q && line[i + 1] === '"') {
                    cur += '"';
                    i++;
                  } else {
                    q = !q;
                  }
                } else if (ch === "," && !q) {
                  out.push(cur.trim());
                  cur = "";
                } else {
                  cur += ch;
                }
              }
              out.push(cur.trim());
              return out;
            };

            const head = parseLine(lines[0]).map((h) => h.replace(/^\uFEFF/, "").toLowerCase());
            const imported = [];

            for (let i = 1; i < lines.length; i++) {
              const cols = parseLine(lines[i]);
              if (cols.length < 2) continue;
              const getCol = (keys) => {
                const idx = head.findIndex((h) => keys.some((k) => h.includes(k)));
                return idx >= 0 ? cols[idx] : "";
              };

              const idNum = parseInt(getCol(["order id", "id"]), 10);
              const customer = getCol(["customer", "πελάτης"]) || `Πελάτης #${i}`;
              const customerPhone = getCol(["phone", "τηλέφωνο"]);
              const customerEmail = getCol(["email"]);
              const customerAddress = getCol(["address", "διεύθυνση"]);
              const prodStr = getCol(["product", "προϊόν"]);
              const qtyNum = parseInt(getCol(["quantity", "ποσότητα"]), 10) || 1;
              const galQty = parseInt(getCol(["galaxy"]), 10);
              const blkQty = parseInt(getCol(["black qty"]), 10);

              const items = [];
              if (!isNaN(galQty) || !isNaN(blkQty)) {
                if (galQty > 0) items.push({ product: PRODUCT_GALAXY, qty: galQty });
                if (blkQty > 0) items.push({ product: PRODUCT_BLACK, qty: blkQty });
              } else {
                const hasGal = prodStr.toLowerCase().includes("galaxy");
                const hasBlk = prodStr.toLowerCase().includes("black") && !prodStr.toLowerCase().includes("red-black");
                if (hasGal && hasBlk) {
                  items.push({ product: PRODUCT_GALAXY, qty: 1 }, { product: PRODUCT_BLACK, qty: 1 });
                } else if (hasBlk) {
                  items.push({ product: PRODUCT_BLACK, qty: qtyNum });
                } else {
                  items.push({ product: PRODUCT_GALAXY, qty: qtyNum });
                }
              }
              if (!items.length) items.push({ product: PRODUCT_GALAXY, qty: 1 });

              const amtRaw = getCol(["total amount", "amount", "ποσό"]).replace(/[€\s]/g, "");
              const totalAmount = amtRaw === "" ? null : parseFloat(amtRaw);
              const paidRaw = getCol(["paid", "πληρωμή"]).toLowerCase();
              const isPaid = paidRaw ? ["yes", "true", "1", "ναι", "gift"].includes(paidRaw) : Boolean(totalAmount && totalAmount > 0);
              const paymentMethod = getCol(["payment method", "τρόπος πληρωμής"]);

              imported.push({
                id: isNaN(idNum) ? i : idNum,
                customer,
                customerPhone,
                customerEmail,
                customerAddress,
                items,
                totalAmount: isNaN(totalAmount) ? null : totalAmount,
                isPaid,
                paymentMethod,
                orderDate: toISODate(getCol(["order date", "date", "ημερομηνία"])),
                salesChannel: getCol(["sales channel", "channel"]) || "Direct Message",
                status: getCol(["status", "κατάσταση"]) || "Pending",
                courierName: getCol(["courier"]) || "On hand",
                trackingNumber: getCol(["tracking"]),
                invoiceNumber: getCol(["invoice", "receipt"])
              });
            }

            if (imported.length > 0) {
              await sbFetch("orders?id=gte.0", { method: "DELETE" });
              await sbFetch("orders", {
                method: "POST",
                body: JSON.stringify(imported.map((o) => serializeOrderForDb(o, true)))
              });
              setOrders(imported);
              showToast(`Εισήχθησαν ${imported.length} παραγγελίες στο Supabase.`);
            }
          } catch (err) {
            showToast(`Σφάλμα εισαγωγής CSV: ${err.message}`, "error");
          }
        };
        reader.readAsText(file);
        e.target.value = "";
      };

    function OrderModal({ initialData, presetStatus, nextId, config, onQuickAdd, onClose, onSave }) {
      const [productQtys, setProductQtys] = useState(() => {
        const map = {};
        config.products.forEach((p, idx) => {
          const existing = initialData?.items?.find((i) => i.product === p.name)?.qty;
          map[p.name] = initialData ? existing || 0 : idx === 0 ? 1 : 0;
        });
        return map;
      });
      const [customer, setCustomer] = useState(initialData?.customer || "");
      const [customerPhone, setCustomerPhone] = useState(initialData?.customerPhone || "");
      const [customerEmail, setCustomerEmail] = useState(initialData?.customerEmail || "");
      const [customerAddress, setCustomerAddress] = useState(initialData?.customerAddress || "");
      const [totalAmount, setTotalAmount] = useState(
        initialData?.totalAmount !== null && initialData?.totalAmount !== undefined
          ? String(initialData.totalAmount)
          : ""
      );
      const [isPaid, setIsPaid] = useState(initialData ? Boolean(initialData.isPaid) : false);
      const [paymentMethod, setPaymentMethod] = useState(initialData?.paymentMethod || "");
      const [orderDate, setOrderDate] = useState(
        initialData?.orderDate || new Date().toISOString().slice(0, 10)
      );
      const [salesChannel, setSalesChannel] = useState(
        initialData?.salesChannel || config.channels[1]?.name || config.channels[0]?.name || "Direct Message"
      );
      const [status, setStatus] = useState(
        initialData?.status || presetStatus || config.statuses[0]?.name || "Pending"
      );
      const [courierName, setCourierName] = useState(
        initialData?.courierName || config.couriers[0]?.name || "On hand"
      );
      const [trackingNumber, setTrackingNumber] = useState(initialData?.trackingNumber || "");
      const [invoiceNumber, setInvoiceNumber] = useState(initialData?.invoiceNumber || "");
      const [error, setError] = useState("");

      const [addingProd, setAddingProd] = useState(false);
      const [newProdName, setNewProdName] = useState("");
      const [newProdStock, setNewProdStock] = useState("50");

      const totalUnits = Object.values(productQtys).reduce(
        (s, q) => s + Math.max(0, parseInt(q, 10) || 0),
        0
      );

      const submitOrder = (e) => {
        e.preventDefault();
        if (!customer.trim()) {
          setError("Συμπλήρωσε το όνομα του πελάτη.");
          return;
        }
        const items = [];
        Object.entries(productQtys).forEach(([prodName, rawQ]) => {
          const q = Math.max(0, parseInt(rawQ, 10) || 0);
          if (q > 0) items.push({ product: prodName, qty: q });
        });
        if (!items.length) {
          setError("Επίλεξε τουλάχιστον 1 τεμάχιο.");
          return;
        }
        const amt = totalAmount.trim() === "" ? null : parseFloat(totalAmount);
        const isGift = salesChannel === "Gift" || amt === 0;
        onSave({
          customer: customer.trim(),
          customerPhone: customerPhone.trim(),
          customerEmail: customerEmail.trim(),
          customerAddress: customerAddress.trim(),
          items,
          totalAmount: isNaN(amt) ? null : amt,
          isPaid: isGift ? true : isPaid,
          paymentMethod: isGift ? "" : paymentMethod,
          orderDate,
          salesChannel,
          status,
          courierName,
          trackingNumber: trackingNumber.trim(),
          invoiceNumber: invoiceNumber.trim()
        });
      };

      return (
        <div className="nvr-backdrop fixed inset-0 z-50 flex items-center justify-center p-4 overflow-y-auto">
          <div className="nvr-glass-modal rounded-2xl max-w-lg w-full overflow-visible my-auto">
            <div className="px-5 py-4 border-b border-[#D8CFD7] flex items-center justify-between bg-[#EFECEF] rounded-t-2xl">
              <div className="flex items-center gap-2">
                <span className="px-2 py-0.5 rounded bg-[#6E1927] text-white font-mono text-xs font-bold">
                  #{initialData ? initialData.id : nextId}
                </span>
                <h2 className="nvr-display-font text-base sm:text-lg font-bold text-[#40101A]">
                  {initialData ? "Επεξεργασία Παραγγελίας" : "Νέα Παραγγελία «3,14»"}

              </div>
              <button onClick={onClose} className="p-1 text-[#6E5C68] hover:text-[#40101A] rounded-lg">
                ✕
              </button>
            </div>

            <form onSubmit={submitOrder} className="p-5 space-y-3.5 text-sm">
              {error && (
                <div className="p-2.5 rounded-lg bg-rose-100 border border-rose-300 text-[#6E1927] text-xs font-bold">
                  {error}
                </div>
              )}

              <div>
                <label className="block text-xs font-bold text-[#40101A] mb-1">Πελάτης *</label>

                  type="text"

                  onChange={(e) => setCustomer(e.target.value)}
                  placeholder="Ονοματεπώνυμο πελάτη"
                  className="w-full px-3 py-2 rounded-lg border border-[#C7BEC6] bg-white text-[#40101A] focus:outline-none focus:border-[#6E1927]"

                  <input
                    type="tel"

                    onChange={(e) => setCustomerPhone(e.target.value)}
                    placeholder="π.χ. 69XXXXXXXX"
                    className="w-full px-3 py-1.5 rounded-lg border border-[#C7BEC6] bg-white text-[#40101A] focus:outline-none focus:border-[#6E1927] text-xs font-mono"
                  />

    const PIE_HEX_PALETTE = {
      crimsonVinyl: "#6E1927",
      blackVinyl: "#2C1820",
      amber: "#D97706",
      sky: "#0284C7",
      emerald: "#059669",
      cyan: "#0E7490",
      indigo: "#4F46E5",

    function VinylPieCard({ title, subtitle, slices, valueFormatter = (v) => v, centerLabel = "ΣΥΝΟΛΟ", centerValue }) {
      const [hoveredIdx, setHoveredIdx] = useState(null);
      const validSlices = slices.filter((s) => s.value > 0);
      const total = validSlices.reduce((sum, s) => sum + s.value, 0);

      const radius = 56;
      const strokeWidth = 22;
      const circumference = 2 * Math.PI * radius;

      let cumulativePercent = 0;
      const segments = validSlices.map((s, idx) => {
        const pct = total > 0 ? s.value / total : 0;
        const dashArray = `${pct * circumference} ${circumference}`;
        const dashOffset = -cumulativePercent * circumference;
        cumulativePercent += pct;
        return {
          ...s,
          idx,
          pct,
          dashArray,
          dashOffset,
          hex: s.hex || PIE_HEX_PALETTE[s.color] || "#6E1927"
        };
      });

      const activeSeg = hoveredIdx !== null ? segments.find((s) => s.idx === hoveredIdx) : null;

      return (
        <div className="bg-white/85 backdrop-blur-md rounded-2xl border border-white/90 p-4 shadow-sm flex flex-col justify-between transition-all hover:shadow-md">
          <div className="mb-3">
            <h3 className="text-sm font-extrabold text-[#40101A]">{title}</h3>
            {subtitle && <p className="text-[11px] text-[#6E5C68]">{subtitle}</p>}
          </div>

          {total === 0 ? (
            <div className="py-10 text-center text-xs text-[#6E5C68] italic">
              Δεν υπάρχουν διαθέσιμα δεδομένα.
            </div>
          ) : (
            <div className="flex flex-col sm:flex-row items-center gap-4">
              {/* SVG Vinyl Donut */}
              <div className="relative w-36 h-36 shrink-0 flex items-center justify-center">
                <svg viewBox="0 0 150 150" className="w-full h-full -rotate-90 overflow-visible">
                  <circle
                    cx="75"
                    cy="75"
                    r={radius}
                    fill="transparent"
                    stroke="#E7DFE6"
                    strokeWidth={strokeWidth}
                  />
                  {segments.map((seg) => {
                    const isHovered = hoveredIdx === seg.idx;
                    return (
                      <circle
                        key={seg.label}
                        cx="75"
                        cy="75"
                        r={radius}
                        fill="transparent"
                        stroke={seg.hex}
                        strokeWidth={isHovered ? strokeWidth + 5 : strokeWidth}
                        strokeDasharray={seg.dashArray}
                        strokeDashoffset={seg.dashOffset}
                        onMouseEnter={() => setHoveredIdx(seg.idx)}
                        onMouseLeave={() => setHoveredIdx(null)}
                        style={{
                          transition: "stroke-width 0.22s ease, opacity 0.22s ease",
                          opacity: hoveredIdx !== null && !isHovered ? 0.55 : 1,
                          cursor: "pointer"
                        }}
                      />
                    );
                  })}
                </svg>

                {/* Center Vinyl Label */}
                <div className="absolute inset-0 flex flex-col items-center justify-center text-center pointer-events-none px-4">
                  <span className="text-[9px] font-extrabold uppercase tracking-wider text-[#6E5C68] truncate max-w-[74px]">
                    {activeSeg ? activeSeg.label : centerLabel}
                  </span>
                  <span className="text-sm font-black text-[#40101A] tabular-nums leading-tight mt-0.5">
                    {activeSeg
                      ? valueFormatter(activeSeg.value)
                      : centerValue !== undefined
                      ? centerValue
                      : valueFormatter(total)}
                  </span>
                  {activeSeg && (
                    <span className="text-[10px] font-bold text-[#6E1927] tabular-nums">
                      {(activeSeg.pct * 100).toFixed(1)}%
                    </span>
                  )}
                </div>
              </div>

              {/* Legend */}
              <div className="flex-1 w-full space-y-1.5 max-h-40 overflow-y-auto pr-1">
                {segments.map((seg) => {
                  const isHovered = hoveredIdx === seg.idx;
                  return (
                    <div
                      key={seg.label}
                      onMouseEnter={() => setHoveredIdx(seg.idx)}
                      onMouseLeave={() => setHoveredIdx(null)}
                      className={`flex items-center justify-between gap-2 px-2 py-1 rounded-lg text-xs transition-colors cursor-pointer ${
                        isHovered ? "bg-[#EFE4E8] font-bold" : "hover:bg-[#F4EEF3]"
                      }`}
                    >
                      <div className="flex items-center gap-2 min-w-0">
                        <span
                          className="w-2.5 h-2.5 rounded-full shrink-0"
                          style={{ backgroundColor: seg.hex }}
                        />
                        <span className="truncate text-[#40101A]">{seg.label}</span>
                      </div>
                      <div className="flex items-center gap-2 shrink-0 tabular-nums">
                        <span className="font-extrabold text-[#40101A]">
                          {valueFormatter(seg.value)}
                        </span>
                        <span className="text-[10.5px] font-semibold text-[#6E5C68] w-11 text-right">
                          {(seg.pct * 100).toFixed(0)}%
                        </span>
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    function StatsPiesModal({ orders, config, inventoryStats, summaryStats, onClose }) {
      const [metricMode, setMetricMode] = useState("units"); // 'units' | 'orders' | 'revenue'

      // 1. By Sales Channel
      const channelSlices = useMemo(() => {
        const map = {};
        config.channels.forEach((c) => {
          map[c.name] = { label: c.name, color: c.color, value: 0 };
        });
        orders.forEach((o) => {
          if (!map[o.salesChannel]) {
            map[o.salesChannel] = { label: o.salesChannel, color: "stone", value: 0 };
          }
          const units = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          const rev = Number(o.totalAmount) || 0;
          map[o.salesChannel].value +=
            metricMode === "revenue" ? rev : metricMode === "orders" ? 1 : units;
        });
        return Object.values(map);
      }, [orders, config.channels, metricMode]);

      // 2. By Payment Method (excluding Gifts)
      const paymentMethodSlices = useMemo(() => {
        const methods = config.paymentMethods || DEFAULT_PAYMENT_METHODS;
        const map = {};
        methods.forEach((m) => {
          map[m.name] = { label: m.name, color: m.color, value: 0 };
        });
        map["Χωρίς καταχώρηση"] = { label: "Χωρίς καταχώρηση", color: "stone", value: 0 };

        orders.forEach((o) => {
          if (isOrderGift(o)) return;
          const key = o.paymentMethod && o.paymentMethod.trim() ? o.paymentMethod : "Χωρίς καταχώρηση";
          if (!map[key]) {
            map[key] = { label: key, color: "indigo", value: 0 };
          }
          const units = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          const rev = Number(o.totalAmount) || 0;
          map[key].value +=
            metricMode === "revenue" ? rev : metricMode === "orders" ? 1 : units;
        });
        return Object.values(map);
      }, [orders, config.paymentMethods, metricMode]);

      // 3. By Vinyl Edition (Galaxy vs Black etc.)
      const editionSlices = useMemo(() => {
        return config.products.map((p) => {
          let units = 0;
          let ordCount = 0;
          let rev = 0;
          orders.forEach((o) => {
            const matching = o.items.filter((i) => i.product === p.name && i.qty > 0);
            if (matching.length > 0) {
              const u = matching.reduce((s, i) => s + Number(i.qty), 0);
              const totalOrdUnits = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0) || 1;
              units += u;
              ordCount += 1;
              rev += ((Number(o.totalAmount) || 0) * u) / totalOrdUnits;
            }
          });
          return {
            label: p.shortName || p.name,
            color: p.color,
            value: metricMode === "revenue" ? Math.round(rev * 100) / 100 : metricMode === "orders" ? ordCount : units
          };
        });
      }, [orders, config.products, metricMode]);

      // 4. By Fulfillment Status (Pending / Shipped / Delivered)
      const statusSlices = useMemo(() => {
        const map = {};
        config.statuses.forEach((s) => {
          map[s.name] = { label: s.name, color: s.color, value: 0 };
        });
        orders.forEach((o) => {
          if (!map[o.status]) {
            map[o.status] = { label: o.status, color: "stone", value: 0 };
          }
          const units = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          const rev = Number(o.totalAmount) || 0;
          map[o.status].value +=
            metricMode === "revenue" ? rev : metricMode === "orders" ? 1 : units;
        });
        return Object.values(map);
      }, [orders, config.statuses, metricMode]);

      // 5. By Courier / Delivery Method (Box Now vs On hand)
      const courierSlices = useMemo(() => {
        const map = {};
        config.couriers.forEach((c) => {
          map[c.name] = { label: c.name, color: c.color, value: 0 };
        });
        orders.forEach((o) => {
          if (!map[o.courierName]) {
            map[o.courierName] = { label: o.courierName, color: "stone", value: 0 };
          }
          const units = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          const rev = Number(o.totalAmount) || 0;
          map[o.courierName].value +=
            metricMode === "revenue" ? rev : metricMode === "orders" ? 1 : units;
        });
        return Object.values(map);
      }, [orders, config.couriers, metricMode]);

      // 6. Paid vs Unpaid vs Gift Breakdown
      const financialMixSlices = useMemo(() => {
        let paidVal = 0;
        let unpaidVal = 0;
        let giftVal = 0;
        orders.forEach((o) => {
          const units = o.items.reduce((s, i) => s + (Number(i.qty) || 0), 0);
          const rev = Number(o.totalAmount) || 0;
          const v = metricMode === "revenue" ? rev : metricMode === "orders" ? 1 : units;
          if (isOrderGift(o)) {
            giftVal += v;
          } else if (o.isPaid) {
            paidVal += v;
          } else {
            unpaidVal += v;
          }
        });
        return [
          { label: "Πληρωμένες", color: "emerald", value: paidVal },
          { label: "Απλήρωτες", color: "rose", value: unpaidVal },
          { label: "Δώρα (Promo / Gift)", color: "fuchsia", value: giftVal }
        ];
      }, [orders, metricMode]);

      const formatter =
        metricMode === "revenue"
          ? (v) => `€${Number(v).toFixed(0)}`
          : metricMode === "orders"
          ? (v) => `${v} παρ.`
          : (v) => `${v} τεμ.`;

      const avgOrderValue = useMemo(() => {
        const paidOrPriced = orders.filter((o) => !isOrderGift(o) && Number(o.totalAmount) > 0);
        if (!paidOrPriced.length) return 0;
        const sum = paidOrPriced.reduce((s, o) => s + Number(o.totalAmount), 0);
        return sum / paidOrPriced.length;
      }, [orders]);

      return (
        <div className="nvr-backdrop fixed inset-0 z-50 flex items-center justify-center p-3 sm:p-5 overflow-y-auto">
          <div className="nvr-glass-modal rounded-2xl max-w-5xl w-full overflow-hidden my-auto flex flex-col max-h-[92vh]">
            {/* Modal Header */}
            <div className="px-5 py-4 border-b border-[#D8CFD7] flex flex-wrap items-center justify-between gap-3 bg-[#EFECEF]/90 shrink-0">
              <div className="flex items-center gap-2.5">
                <span className="w-8 h-8 rounded-xl bg-[#6E1927] text-white flex items-center justify-center text-base shadow-xs">
                  ◔
                </span>
                <div>
                  <h2 className="nvr-display-font text-base sm:text-lg font-bold text-[#40101A]">
                    Στατιστικά & Αναλύσεις «3,14»
                  </h2>
                  <p className="text-[11px] text-[#6E5C68]">
                    Πέρνα τον κέρσορα πάνω από κάθε κομμάτι πίτας για αναλυτικά ποσοστά
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-2 flex-wrap">
                {/* Metric Switcher */}
                <div className="flex items-center gap-1 bg-[#E2DAE1] p-1 rounded-xl border border-[#CFC5CE]">
                  <button
                    type="button"
                    onClick={() => setMetricMode("units")}
                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      metricMode === "units"
                        ? "bg-[#6E1927] text-white shadow-2xs"
                        : "text-[#40101A] hover:bg-white/60"
                    }`}
                  >
                    Τεμάχια LP
                  </button>
                  <button
                    type="button"
                    onClick={() => setMetricMode("orders")}
                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      metricMode === "orders"
                        ? "bg-[#6E1927] text-white shadow-2xs"
                        : "text-[#40101A] hover:bg-white/60"
                    }`}
                  >
                    Παραγγελίες
                  </button>
                  <button
                    type="button"
                    onClick={() => setMetricMode("revenue")}
                    className={`px-2.5 py-1 rounded-lg text-xs font-bold transition-all cursor-pointer ${
                      metricMode === "revenue"
                        ? "bg-[#6E1927] text-white shadow-2xs"
                        : "text-[#40101A] hover:bg-white/60"
                    }`}
                  >
                    Έσοδα (€)
                  </button>
                </div>

                <button
                  onClick={onClose}
                  className="p-1.5 text-[#6E5C68] hover:text-[#40101A] hover:bg-black/5 rounded-lg cursor-pointer"
                >
                  ✕
                </button>
              </div>
            </div>

            {/* Scrollable Body */}
            <div className="p-4 sm:p-5 overflow-y-auto space-y-4">
              {/* Top Quick Insights Strip */}
              <div className="grid grid-cols-2 sm:grid-cols-4 gap-2.5 tabular-nums">
                <div className="bg-white/80 rounded-xl border border-white p-3">
                  <span className="text-[10px] font-bold uppercase text-[#6E5C68] block">
                    Συνολική Διάθεση
                  </span>
                  <span className="text-lg font-black text-[#40101A]">
                    {summaryStats.totalUnits} <span className="text-xs font-semibold text-[#6E5C68]">/ 200 LP</span>
                  </span>
                </div>
                <div className="bg-white/80 rounded-xl border border-white p-3">
                  <span className="text-[10px] font-bold uppercase text-emerald-800 block">
                    Εισπραχθέντα
                  </span>
                  <span className="text-lg font-black text-emerald-900">
                    €{summaryStats.paidRevenue.toFixed(2)}
                  </span>
                </div>
                <div className="bg-white/80 rounded-xl border border-white p-3">
                  <span className="text-[10px] font-bold uppercase text-[#6E1927] block">
                    Μέση Αξία Πώλησης
                  </span>
                  <span className="text-lg font-black text-[#40101A]">
                    €{avgOrderValue.toFixed(2)}
                  </span>
                </div>
                <div className="bg-white/80 rounded-xl border border-white p-3">
                  <span className="text-[10px] font-bold uppercase text-rose-800 block">
                    Εκκρεμείς Πληρωμές
                  </span>
                  <span className="text-lg font-black text-rose-700">
                    {summaryStats.unpaidCount} <span className="text-xs font-semibold">παραγγελίες</span>
                  </span>
                </div>
              </div>

              {/* 6 Pie Charts Grid */}
              <div className="grid grid-cols-1 md:grid-cols-2 gap-3.5">
                <VinylPieCard
                  title="1. Ανά Κανάλι Πώλησης"
                  subtitle="Bandcamp, Direct Message, Live Concert, Gift"
                  slices={channelSlices}
                  valueFormatter={formatter}
                />

                <VinylPieCard
                  title="2. Ανά Τρόπο Πληρωμής"
                  subtitle="Iris, Revolut, Μετρητά, Web banking (εξαιρ. Δώρα)"
                  slices={paymentMethodSlices}
                  valueFormatter={formatter}
                />

                <VinylPieCard
                  title="3. Ανά Έκδοση Βινυλίου"
                  subtitle="Galaxy red-black vs Black"
                  slices={editionSlices}
                  valueFormatter={formatter}
                />

                <VinylPieCard
                  title="4. Οικονομική Εικόνα"
                  subtitle="Πληρωμένες, Απλήρωτες & Δώρα (Promo)"
                  slices={financialMixSlices}
                  valueFormatter={formatter}
                />

                <VinylPieCard
                  title="5. Ανά Κατάσταση (Status)"
                  subtitle="Pending, Shipped, Delivered"
                  slices={statusSlices}
                  valueFormatter={formatter}
                />

                <VinylPieCard
                  title="6. Ανά Τρόπο Αποστολής"
                  subtitle="Box Now vs On hand (χέρι με χέρι)"
                  slices={courierSlices}
                  valueFormatter={formatter}
                />
              </div>
            </div>

            {/* Footer */}
            <div className="px-5 py-3 bg-[#EFECEF]/90 border-t border-[#D8CFD7] flex items-center justify-between shrink-0">
              <span className="text-[11px] text-[#6E5C68]">
                Υπολογίζεται αυτόματα από τις <strong>{orders.length}</strong> καταχωρημένες παραγγελίες.
              </span>
              <button
                type="button"
                onClick={onClose}
                className="nvr-btn-press px-4 py-1.5 text-xs font-bold text-white bg-[#6E1927] hover:bg-[#8A2233] rounded-lg cursor-pointer"
              >
                Κλείσιμο
              </button>
            </div>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    if (rootElement && window.React && window.ReactDOM) {
      createRoot(rootElement).render(<App />);
    }
  </script>
</body>
</html>
